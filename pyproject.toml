[project]
name = "queryforge-rsi"
version = "0.1.0"
description = "Auditable recursive improvement of real SQL research procedures"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4", "pyarrow>=21", "sqlglot>=27", "typer>=0.19", "pydantic>=2.11", "psutil>=7", "numpy>=2.2"]

[project.scripts]
queryforge = "queryforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13", "mypy>=1.18"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/queryforge"]
